name: Build and publish to deploy branch

# The repository holds source only; the deployable site is the static export in
# out/, which is gitignored. Hostinger's Git integration clones a branch into
# public_html and does not run a build, so this workflow builds on every push to
# master and publishes the contents of out/ to a separate `deploy` branch.
# Point Hostinger at the `deploy` branch, not master.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys race each other onto the same branch.
concurrency:
  group: deploy-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history: scripts/generate-static-sitemaps.js derives <lastmod>
          # from the last commit that touched each source file. A shallow clone
          # would make it fall back to the build time for every URL.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Verify the export looks deployable
        run: |
          set -e
          test -f out/index.html    || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.htaccess     || { echo "::error::out/.htaccess missing"; exit 1; }
          test -f out/robots.txt    || { echo "::error::out/robots.txt missing"; exit 1; }
          test -f out/sitemap.xml   || { echo "::error::out/sitemap.xml missing"; exit 1; }
          test -f out/404.html      || { echo "::error::out/404.html missing"; exit 1; }
          echo "Export OK: $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      - name: Publish out/ to the deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .deploy

          # Reuse the existing deploy branch so unchanged files (76MB of images)
          # are not re-uploaded on every run - git only sends new blobs.
          if git ls-remote --exit-code --heads "$REMOTE" deploy >/dev/null 2>&1; then
            git clone --single-branch --branch deploy "$REMOTE" .deploy
          else
            echo "deploy branch does not exist yet - creating it"
            git clone --single-branch "$REMOTE" .deploy
            git -C .deploy checkout --orphan deploy
            git -C .deploy rm -rf --quiet . || true
          fi

          # Replace the branch contents with the fresh build, keeping .git
          find .deploy -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a out/. .deploy/

          cd .deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build output is identical to the current deploy branch - nothing to push."
          else
            git commit -m "Deploy ${GITHUB_SHA::7}"
            git push "$REMOTE" deploy
            echo "Pushed build ${GITHUB_SHA::7} to the deploy branch."
          fi
